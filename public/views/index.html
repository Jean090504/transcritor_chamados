<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcritor Operacional | Automação</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css" />
  
  <!-- Favicon SVG moderno -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%231d4ed8%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>T</text></svg>">
</head>
<body>
  <!-- Fundos com iluminação dinâmica suave -->
  <div class="circulo-luz luz-1"></div>
  <div class="circulo-luz luz-2"></div>

  <main class="container-aplicacao">
    <!-- Cabeçalho do Card -->
    <header class="cabecalho-cartao">
      <div class="icone-cabecalho">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <path d="M12 18v-6"></path>
          <path d="m9 15 3 3 3-3"></path>
        </svg>
      </div>
      <div class="info-cabecalho">
        <div class="linha-titulo">
          <h1>Transcritor de Chamados</h1>
          <span class="badge-status">
            <span class="ponto-pulsante"></span>
            Operacional Online
          </span>
        </div>
        <p>Extração e estruturação automática para o Google Sheets</p>
      </div>
    </header>

    <!-- Seção do Formulário -->
    <section class="area-formulario">
      <div class="cabecalho-texto">
        <label for="textoChamado">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="9" x2="20" y2="9"></line>
            <line x1="4" y1="15" x2="20" y2="15"></line>
            <line x1="10" y1="3" x2="8" y2="21"></line>
            <line x1="16" y1="3" x2="14" y2="21"></line>
          </svg>
          Texto Bruto do Chamado
        </label>
        <div class="acoes-texto">
          <button type="button" id="botaoColar" class="botao-secundario" title="Colar da área de transferência">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            </svg>
            Colar
          </button>
          <button type="button" id="botaoLimpar" class="botao-secundario" title="Limpar campo">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
            Limpar
          </button>
        </div>
      </div>

      <div class="textarea-wrapper">
        <textarea
          id="textoChamado"
          rows="10"
          placeholder="Cole aqui o texto completo com dados do chamado, retratação, base acionada e tentativas..."
          spellcheck="false"
        ></textarea>
        <div class="barra-inferior-textarea">
          <span class="dica-teclado">Pressione <kbd>Ctrl</kbd> + <kbd>Enter</kbd> para enviar rápido</span>
          <span id="contadorCaracteres" class="contador-caracteres">0 caracteres</span>
        </div>
      </div>

      <button id="botaoProcessar" class="botao-primario">
        <span class="conteudo-botao">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            <polyline points="9 11 12 14 22 4"></polyline>
          </svg>
          <span id="textoBotao">Processar e Gravar na Planilha</span>
        </span>
        <div id="indicadorCarregamento" class="indicador-carregamento oculto">
          <div class="spinner"></div>
          <span>Extraindo dados com IA...</span>
        </div>
      </button>

      <div id="alertaFeedback" class="painel-alerta oculto"></div>
    </section>
  </main>

  <script src="/js/main.js" defer></script>
</body>
</html>
