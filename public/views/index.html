<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcritor de Chamados | Operacional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="fundo-decorativo"></div>

  <main class="container-aplicacao">
    <header class="cabecalho-cartao">
      <div>
        <h1>Transcritor de Chamados</h1>
        <p>Extração automática de dados operacionais</p>
      </div>
    </header>

    <section class="area-formulario">
      <div class="cabecalho-texto">
        <label for="textoChamado">Texto do Chamado</label>
        <div class="acoes-texto">
          <button type="button" id="botaoColar" class="botao-secundario" title="Colar da área de transferência">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            </svg>
            Colar
          </button>
          <button type="button" id="botaoLimpar" class="botao-secundario" title="Limpar campo">
            Limpar
          </button>
        </div>
      </div>

      <div class="textarea-wrapper">
        <textarea
          id="textoChamado"
          rows="9"
          placeholder="Cola aqui o bloco de texto bruto do chamado operacional..."
          spellcheck="false"
        ></textarea>
        <span id="contadorCaracteres" class="contador-caracteres">0 caracteres</span>
      </div>

      <button id="botaoProcessar" class="botao-primario">
        <span class="conteudo-botao"> 
          <span id="textoBotao">Processar e Gravar</span>
        </span>
        <div id="indicadorCarregamento" class="indicador-carregamento oculto">
          <div class="spinner"></div>
          <span>A processar...</span>
        </div>
      </button>

      <div id="alertaFeedback" class="painel-alerta oculto"></div>
    </section>
  </main>

  <script src="/js/main.js" defer></script>
</body>
</html>
