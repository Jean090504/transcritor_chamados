<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcritor de Chamados | Operacional</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css" />
  
  <!-- Favicon SVG baseado exatamente na sua logo -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23eff6ff'/><path d='M22 16h14l8 8v20a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4z' fill='none' stroke='%232563eb' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/><polyline points='36 16 36 24 44 24' fill='none' stroke='%232563eb' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/><path d='M32 29v13' fill='none' stroke='%232563eb' stroke-width='4.5' stroke-linecap='round'/><path d='M26 36l6 6 6-6' fill='none' stroke='%232563eb' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <!-- Iluminação dinâmica suave no fundo -->
  <div class="circulo-luz luz-1"></div>
  <div class="circulo-luz luz-2"></div>

  <main class="container-aplicacao">
    <!-- Cabeçalho do Card (Sem Operação Online) -->
    <header class="cabecalho-cartao">
      <div class="icone-cabecalho">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="12" x2="12" y2="18"></line>
          <polyline points="9 15 12 18 15 15"></polyline>
        </svg>
      </div>
      <div class="info-cabecalho">
        <h1>Transcritor de Chamados</h1>
        <p>Extração e estruturação automática de dados operacionais</p>
      </div>
    </header>

    <!-- Formulário -->
    <section class="area-formulario">
      <div class="cabecalho-texto">
        <label for="textoChamado">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="9" x2="20" y2="9"></line>
            <line x1="4" y1="15" x2="20" y2="15"></line>
            <line x1="10" y1="3" x2="8" y2="21"></line>
            <line x1="16" y1="3" x2="14" y2="21"></line>
          </svg>
          Texto do Chamado
        </label>
        <div class="acoes-texto">
          <button type="button" id="botaoColar" class="botao-secundario" title="Colar da área de transferência">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            </svg>
            Colar
          </button>
          <button type="button" id="botaoLimpar" class="botao-secundario" title="Limpar campo">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
            Limpar
          </button>
        </div>
      </div>

      <div class="textarea-wrapper">
        <textarea
          id="textoChamado"
          rows="10"
          placeholder="Cola aqui o bloco de texto bruto do chamado operacional..."
          spellcheck="false"
        ></textarea>
        <div class="barra-inferior-textarea">
          <span class="dica-teclado">Pressione <kbd>Ctrl</kbd> + <kbd>Enter</kbd> para envio rápido</span>
          <span id="contadorCaracteres" class="contador-caracteres">0 caracteres</span>
        </div>
      </div>

      <button id="botaoProcessar" class="botao-primario">
        <span class="conteudo-botao">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            <polyline points="9 11 12 14 22 4"></polyline>
          </svg>
          <span id="textoBotao">Processar e Gravar</span>
        </span>
        <div id="indicadorCarregamento" class="indicador-carregamento oculto">
          <div class="spinner"></div>
          <span>A processar chamado...</span>
        </div>
      </button>

      <div id="alertaFeedback" class="painel-alerta oculto"></div>
    </section>
  </main>

  <script src="/js/main.js" defer></script>
</body>
</html>
