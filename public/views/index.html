<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcritor de Chamados | Operacional</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css" />
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23eff6ff'/><path d='M22 16h14l8 8v20a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4z' fill='none' stroke='%232563eb' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/><polyline points='36 16 36 24 44 24' fill='none' stroke='%232563eb' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/><path d='M32 29v13' fill='none' stroke='%232563eb' stroke-width='4.5' stroke-linecap='round'/><path d='M26 36l6 6 6-6' fill='none' stroke='%232563eb' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <div class="circulo-luz luz-1"></div>
  <div class="circulo-luz luz-2"></div>

  <!-- Botão Dark / Light -->
  <button id="botaoTema" class="botao-tema" title="Alternar Modo Escuro / Claro">
    <svg id="iconeSol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg id="iconeLua" class="oculto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <main class="container-aplicacao">
    <header class="cabecalho-cartao">
      <div class="icone-cabecalho">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="12" x2="12" y2="18"></line>
          <polyline points="9 15 12 18 15 15"></polyline>
        </svg>
      </div>
      <div class="info-cabecalho">
        <h1>Transcritor de Chamados</h1>
        <p>Extração e estruturação automática de dados operacionais</p>
      </div>
    </header>

    <!-- Mini Painel de Métricas do Turno -->
    <section class="painel-metricas">
      <div class="card-metrica">
        <span class="metrica-rotulo">Gravados Hoje</span>
        <strong id="metricaTotal" class="metrica-valor">0</strong>
      </div>
      <div class="card-metrica">
        <span class="metrica-rotulo">Prévia Média</span>
        <strong id="metricaMediaPrevia" class="metrica-valor">--</strong>
      </div>
      <div class="card-metrica card-metrica-larga">
        <span class="metrica-rotulo">Seguradoras do Turno</span>
        <div id="metricaSeguradoras" class="metrica-seguradoras">Nenhum registo</div>
      </div>
    </section>

    <!-- Formulário Principal -->
    <section class="area-formulario">
      <div class="cabecalho-texto">
        <label for="textoChamado">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="9" x2="20" y2="9"></line>
            <line x1="4" y1="15" x2="20" y2="15"></line>
            <line x1="10" y1="3" x2="8" y2="21"></line>
            <line x1="16" y1="3" x2="14" y2="21"></line>
          </svg>
          Texto do Chamado
        </label>
        <div class="acoes-texto">
          <button type="button" id="botaoColar" class="botao-secundario" title="Colar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            </svg>
            Colar
          </button>
          <button type="button" id="botaoLimpar" class="botao-secundario" title="Limpar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
            Limpar
          </button>
        </div>
      </div>

      <div class="textarea-wrapper">
        <textarea
          id="textoChamado"
          rows="10"
          placeholder="Cole aqui o texto do chamado (ou mude de janela com ele copiado para auto-preenchimento)..."
          spellcheck="false"
        ></textarea>
        <div class="barra-inferior-textarea">
          <span class="dica-teclado">Pressione <kbd>Ctrl</kbd> + <kbd>Enter</kbd> para envio rápido</span>
          <span id="contadorCaracteres" class="contador-caracteres">0 caracteres</span>
        </div>
      </div>

      <button id="botaoProcessar" class="botao-primario">
        <span class="conteudo-botao">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            <polyline points="9 11 12 14 22 4"></polyline>
          </svg>
          <span id="textoBotao">Analisar e Rever</span>
        </span>
        <div id="indicadorCarregamento" class="indicador-carregamento oculto">
          <div class="spinner"></div>
          <span>A processar com IA...</span>
        </div>
      </button>

      <!-- Histórico Recente -->
      <div class="container-historico">
        <div class="cabecalho-historico" id="toggleHistorico">
          <span>Últimos Envios Locais (<span id="totalHistorico">0</span>)</span>
          <svg id="setaHistorico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
        <div id="listaHistorico" class="lista-historico oculto"></div>
      </div>
    </section>
  </main>

  <!-- Modal de Confirmação e Edição -->
  <div id="modalConfirmacao" class="modal-fundo oculto">
    <div class="modal-conteudo">
      <header class="modal-cabecalho">
        <h2>Revisão dos Dados Extraídos</h2>
        <button type="button" id="fecharModal" class="botao-fechar">&times;</button>
      </header>

      <div id="avisoDuplicadoModal" class="aviso-duplicado oculto"></div>

      <form id="formularioModal" class="grid-campos-modal">
        <div class="campo-grupo">
          <label for="campoProtocolo">Protocolo</label>
          <input type="text" id="campoProtocolo" />
        </div>
        <div class="campo-grupo">
          <label for="campoSeguradora">Seguradora</label>
          <input type="text" id="campoSeguradora" />
        </div>
        <div class="campo-grupo">
          <label for="campoServico">Serviço</label>
          <input type="text" id="campoServico" />
        </div>
        <div class="campo-grupo">
          <label for="campoPreviaServico">Prévia do Serviço</label>
          <input type="text" id="campoPreviaServico" />
        </div>
        <div class="campo-grupo">
          <label for="campoLocalidade">Localidade</label>
          <input type="text" id="campoLocalidade" />
        </div>
        <div class="campo-grupo">
          <label for="campoBaseAcionada">Base Acionada</label>
          <input type="text" id="campoBaseAcionada" />
        </div>
        <div class="campo-grupo">
          <label for="campoDataMarcada">Data Marcada</label>
          <input type="text" id="campoDataMarcada" />
        </div>
        <div class="campo-grupo">
          <label for="campoHorarioMarcado">Horário Marcado</label>
          <input type="text" id="campoHorarioMarcado" />
        </div>
        <div class="campo-grupo campo-span-2">
          <label for="campoRetratacaoInicial">Retratação Inicial</label>
          <input type="text" id="campoRetratacaoInicial" />
        </div>
        <div class="campo-grupo campo-span-2">
          <label for="campoRetratacaoFinal">Retratação Final</label>
          <input type="text" id="campoRetratacaoFinal" />
        </div>
        <div class="campo-grupo campo-span-2">
          <label for="campoResumoTentativas">Resumo Tentativas</label>
          <textarea id="campoResumoTentativas" rows="4"></textarea>
        </div>
      </form>

      <footer class="modal-rodape">
        <button type="button" id="botaoCancelarModal" class="botao-secundario">Cancelar</button>
        <button type="button" id="botaoConfirmarGravacao" class="botao-primario">Gravar na Folha</button>
      </footer>
    </div>
  </div>

  <!-- Container de Toasts Flutuantes -->
  <div id="containerToasts" class="container-toasts" aria-live="polite"></div>

  <script src="/js/main.js" defer></script>
</body>
</html>
